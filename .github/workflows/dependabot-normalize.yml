name: Normalize Dependabot NuGet updates

on:
  workflow_call:
    inputs:
      solution:
        description: Solution file to restore
        required: true
        type: string

jobs:
  normalize:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      packages: read
    steps:
      - name: Check out the Dependabot branch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Align central Microsoft package versions
        shell: pwsh
        run: |
          $props = Join-Path $PWD 'Directory.Packages.props'
          if (-not (Test-Path $props)) { exit 0 }
          [xml]$xml = Get-Content -Raw $props
          $nodes = @($xml.Project.ItemGroup.PackageVersion | Where-Object {
            $_.Include -match '^(Microsoft\.Extensions\.|Microsoft\.EntityFrameworkCore|Microsoft\.Data\.Sqlite)'
          })
          $versions = @($nodes | ForEach-Object { [version]$_.Version })
          if ($versions.Count -eq 0) { exit 0 }
          $target = ($versions | Sort-Object -Descending | Select-Object -First 1).ToString()
          $changed = $false
          foreach ($node in $nodes) {
            if ($node.Version -ne $target) { $node.Version = $target; $changed = $true }
          }
          if ($changed) { $xml.Save($props) }

      - name: Restore and regenerate lock files
        shell: bash
        env:
          GITHUB_PACKAGES_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: dotnet restore "${{ inputs.solution }}" --force-evaluate

      - name: Commit normalized dependency resolution
        shell: bash
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Directory.Packages.props '**/packages.lock.json'
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "ci: normalize Dependabot NuGet resolution"
          git push origin "HEAD:${BRANCH}"
